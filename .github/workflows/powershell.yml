name: powershell

on:
  push:
    branches: [main]
    paths:
      - "tools/discovery/**"
      - ".github/workflows/powershell.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/discovery/**"
      - ".github/workflows/powershell.yml"

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./tools/discovery -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer reported $($results.Count) error(s)."
            exit 1
          } else {
            Write-Host "No PSScriptAnalyzer errors."
          }
